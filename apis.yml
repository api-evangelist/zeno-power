name: Zeno Power
description: Zeno Power is a deep-tech energy company developing radioisotope power
  systems (nuclear batteries) that convert the heat of radioisotope decay into reliable,
  long-duration electricity for extreme environments where conventional power sources
  fail. Its compact radioisotope Stirling generators target 1-100+ watts for use
  cases spanning NASA lunar surface missions (americium-241 fueled), seabed and
  maritime sensor infrastructure, and Department of Defense / U.S. Space Force
  applications (strontium-90 fueled). The company works with partners including NASA,
  the Pentagon, Westinghouse, and Orano, with commercial market delivery targeted
  for 2027. Backed by DCVC, Zeno Power was added to the API Evangelist network as a
  portfolio lead; enrichment found no public API, developer platform, SDKs, or
  technical documentation surface as of this pass.
